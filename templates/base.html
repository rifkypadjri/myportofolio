{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    {% block meta %} {% endblock meta %}
  </head>
  <body>
    <header>
      <div class="container">
        <nav>
          <ul class="nav-links">
            <li>
              <a href="{% url 'main:show_main' %}">Profile</a>
            </li>
            <li><a href="{% url 'main:show_experience' %}">Experience</a></li>
            <li><a href="{% url 'main:show_achievement' %}">Achievement</a></li>
            <li><a href="{% url 'main:show_project' %}">Projects</a></li>
          </ul>
        </nav>
      </div>
    </header>

    {% block content %} {% endblock content %}

    <footer>
      <div class="container">
        <p>&copy; 2026 {{ name }} - {{ npm }} . All Rights Reserved.</p>
      </div>
    </footer>
  </body>
</html>
